apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.example.webviewwrapper"
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.example.webviewwrapper"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Ensure Java/Kotlin compatibility and set Kotlin jvm target to a known supported value
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'

    // Google Play Billing (sample dependency for Play Billing integration)
    implementation 'com.android.billingclient:billing:6.0.1'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
}
